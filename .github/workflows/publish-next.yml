name: Publish @next

# Publishes the work on `dev` to npm under the dist-tag `next`, after Tone.js's
# release workflow: a push to dev (a merged pull request) runs the changesets
# version step, commits the bump to dev and publishes what the registry does
# not have yet. Nothing here touches `latest`: a stable release is made by hand
# (.claude/skills/release/SKILL.md).
#
#   - `dev` is in changesets pre mode (.changeset/pre.json), so the version step
#     gives x.y.z-next.N, and only for the packages with a new changeset and
#     for their dependents. A merge without a changeset publishes nothing.
#   - npm authenticates the publish job by OIDC ("trusted publishing"): every
#     package names this file, `publish-next.yml`, and the environment
#     `npm-next` as a trusted publisher in its settings on npmjs.com. There is
#     no npm token. The environment accepts the branch `dev` only, so a copy of
#     this file on another branch cannot publish.
#   - npm cannot limit a trusted publisher to a dist-tag. That this workflow
#     publishes prereleases with the tag `next` and nothing else is decided in
#     scripts/release/: a change to those scripts, or to this file, is a change
#     to what can reach npm without the hardware key.
#   - Four jobs. Two run other people's code (dependencies' install scripts,
#     the build tools, the tests) and are given nothing but read access. Two
#     hold a right and run only node, git, tar, npm and scripts/release/, which
#     use no dependency. Each of those two checks what it is handed:
#
#       version  installs, builds, tests     reads      hands over the bump
#       commit   applies the bump             may push   only a version bump
#       pack     installs, builds, packs      reads      hands over tarballs
#       publish  uploads the tarballs         may        only the expected
#                                             publish    prereleases
#
#     What dependency code can still do is change what is INSIDE a published
#     package (it builds it), as it can in a build on a maintainer's machine.
#   - The bump commit is pushed with GITHUB_TOKEN, and a push made with it
#     starts no workflow: this one does not start itself again, and the site
#     is not deployed a second time for it.
#   - "Run workflow" (on dev) publishes what is missing after a run that
#     failed: the version step then finds nothing to do, and the publish step
#     skips every version the registry has.
#   - The actions are pinned to commits: a tag can be moved, and this workflow
#     can publish.

on:
  push:
    branches:
      - dev
  workflow_dispatch:

# One at a time, in order: two runs would compute the same version numbers.
concurrency:
  group: publish-next
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    # -o pipefail: a failure on the left of a pipe fails the step.
    shell: bash -eo pipefail {0}

jobs:
  version:
    name: Compute the versions
    # "Run workflow" on another branch would run that branch's copy of this file.
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      active: ${{ steps.pre.outputs.active }}
      bumped: ${{ steps.version.outputs.bumped }}
      base: ${{ steps.base.outputs.sha }}
    steps:
      # The branch as it is now, not the commit that started the run: a run
      # that waited in the queue also takes what was merged in the meantime.
      - name: Checkout dev
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
          persist-credentials: false

      - name: Name the commit the versions are computed on
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check dev is in pre mode
        id: pre
        run: |
          # No pre.json, or one that is being left, means a stable release is
          # being prepared: this workflow then publishes nothing. A pre.json
          # that cannot be read fails the step.
          if [ ! -f .changeset/pre.json ]; then
            state="absent"
          else
            state=$(node -p "const pre = require('./.changeset/pre.json'); pre.mode + ':' + pre.tag")
          fi
          if [ "$state" = "pre:next" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "::notice::dev is not in pre mode with the tag next (pre.json: $state): nothing is published"
          fi

      - name: Setup pnpm
        if: steps.pre.outputs.active == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        if: steps.pre.outputs.active == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.pre.outputs.active == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run the version step
        if: steps.pre.outputs.active == 'true'
        id: version
        run: |
          pnpm exec changeset version
          if git diff --quiet -- packages; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no new changeset: no version changed"
          else
            node scripts/release/check-version-run.mjs
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build packages
        if: steps.version.outputs.bumped == 'true'
        run: pnpm build

      - name: Run unit tests
        if: steps.version.outputs.bumped == 'true'
        run: pnpm test:unit

      # The files the version step changed, laid out as in the repository.
      - name: Collect the bump
        if: steps.version.outputs.bumped == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bump"
          git diff --name-only -z -- packages .changeset | while IFS= read -r -d '' file; do
            mkdir -p "$RUNNER_TEMP/bump/$(dirname "$file")"
            cp "$file" "$RUNNER_TEMP/bump/$file"
          done
          find "$RUNNER_TEMP/bump" -type f | sort

      - name: Hand the bump to the commit job
        if: steps.version.outputs.bumped == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next-bump
          path: ${{ runner.temp }}/bump
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  commit:
    name: Commit the bump to dev
    needs: version
    if: needs.version.outputs.active == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the bump commit
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      # Nothing is installed and nothing is built in this job.
      - name: Checkout dev
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Take the bump from the version job
        if: needs.version.outputs.bumped == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: next-bump
          path: ${{ runner.temp }}/bump

      # If dev moved on since the versions were computed, nothing is committed
      # and nothing is published: the run that the newer merge started does both.
      - name: Apply, commit and push
        if: needs.version.outputs.bumped == 'true'
        env:
          BASE: ${{ needs.version.outputs.base }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$BASE" ]; then
            echo "::error::dev moved on while the versions were being computed"
            exit 1
          fi
          node scripts/release/apply-version-bump.mjs "$RUNNER_TEMP/bump" > "$RUNNER_TEMP/bumped.txt"
          cat "$RUNNER_TEMP/bumped.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages .changeset
          {
            echo "chore(release): next ($(wc -l < "$RUNNER_TEMP/bumped.txt" | tr -d ' ') packages)"
            echo
            echo "Published under the npm dist-tag next by .github/workflows/publish-next.yml:"
            echo
            sed 's/^/- /' "$RUNNER_TEMP/bumped.txt"
          } > "$RUNNER_TEMP/message.txt"
          git commit --quiet -F "$RUNNER_TEMP/message.txt"
          git push origin HEAD:dev

      # The commit the other two jobs use: the bump, or dev as it is when no
      # version changed.
      - name: Name the commit to publish
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  pack:
    name: Build and pack
    needs: commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      missing: ${{ steps.registry.outputs.missing }}
    steps:
      - name: Checkout the commit to publish
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.commit.outputs.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      # Also true with no bump, after a run that committed and then failed.
      - name: Look for versions the registry does not have
        id: registry
        run: |
          node scripts/release/publish-next.mjs --list | tee "$RUNNER_TEMP/missing.txt"
          if grep -q '^missing=0$' "$RUNNER_TEMP/missing.txt"; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.registry.outputs.missing == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build packages
        if: steps.registry.outputs.missing == 'true'
        run: pnpm build

      - name: Pack what the registry does not have
        if: steps.registry.outputs.missing == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          node scripts/release/publish-next.mjs --pack "$RUNNER_TEMP/tarballs"

      - name: Hand the tarballs to the publish job
        if: steps.registry.outputs.missing == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next-tarballs
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: [commit, pack]
    if: needs.pack.outputs.missing == 'true'
    runs-on: ubuntu-latest
    # Accepts the branch dev only (repository settings, Environments), and is
    # named in every package's trusted publisher entry on npmjs.com.
    environment: npm-next
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    steps:
      # For scripts/release/ and the manifests. Nothing is installed and
      # nothing is built in this job. The commit is named by the commit job,
      # which runs no dependency's code either.
      - name: Checkout the commit to publish
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.commit.outputs.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Check npm can publish by OIDC
        run: |
          # Trusted publishing needs npm 11.5.1 or later.
          version=$(npm --version)
          echo "npm $version"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error("npm 11.5.1 or later is needed for trusted publishing"); process.exit(1); }
          ' "$version"

      - name: Take the tarballs from the pack job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: next-tarballs
          path: ${{ runner.temp }}/tarballs

      - name: Publish what the registry does not have
        run: node scripts/release/publish-next.mjs --from "$RUNNER_TEMP/tarballs"
