name: Deploy Website

# One GitHub Pages deployment holds every version of the site:
#
#   main (stable, what npm `latest` ships)  ->  /waveform-playlist/
#   dev  (the current work)                  ->  /waveform-playlist/next/
#   docs-archive (earlier releases, built    ->  /waveform-playlist/v<major>/
#     once by archive-docs.yml)
#
# A Pages deployment replaces the whole site, so a push to main or dev builds
# both and copies the archive in. This file is the same on both branches; a
# change to it goes to both, because a push runs the copy on the pushed branch.

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

env:
  STABLE_REF: main
  NEXT_REF: dev
  ARCHIVE_REF: docs-archive
  NEXT_BASE_URL: /waveform-playlist/next/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable
        uses: actions/checkout@v4
        with:
          ref: ${{ env.STABLE_REF }}
          path: stable

      - name: Checkout next
        uses: actions/checkout@v4
        with:
          ref: ${{ env.NEXT_REF }}
          path: next

      # The archive branch appears with the first archived release.
      - name: Look for the docs archive
        id: archive
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}.git" "$ARCHIVE_REF" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the docs archive
        if: steps.archive.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ARCHIVE_REF }}
          path: archive

      # What a build cannot know from its own checkout: the release on main,
      # and which majors are archived (the v<major> folders of the archive).
      - name: Read the versions
        run: |
          echo "DOCS_STABLE_VERSION=$(node -p "require('./stable/package.json').version")" >> "$GITHUB_ENV"
          majors=""
          if [ -d archive ]; then
            majors=$(cd archive && ls -d v[0-9]* 2>/dev/null | sed 's/^v//' | paste -sd, -)
          fi
          echo "DOCS_ARCHIVED_VERSIONS=$majors" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: next/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            stable/pnpm-lock.yaml
            next/pnpm-lock.yaml

      - name: Build stable site
        working-directory: stable
        env:
          DOCS_CHANNEL: stable
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm --filter @waveform-playlist/ui-components build-storybook
          pnpm --filter website build

      - name: Build next site
        working-directory: next
        env:
          DOCS_CHANNEL: next
          DOCS_BASE_URL: ${{ env.NEXT_BASE_URL }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm --filter @waveform-playlist/ui-components build-storybook
          pnpm --filter website build

      - name: Put the next site and the archive inside the stable one
        run: |
          site=stable/website/build
          place() {
            if [ -e "$site/$2" ]; then
              echo "::error::the stable site already has a /$2 path"
              exit 1
            fi
            cp -R "$1" "$site/$2"
          }
          place next/website/build next
          if [ -d archive ]; then
            for dir in archive/v[0-9]*; do
              [ -d "$dir" ] && place "$dir" "$(basename "$dir")"
            done
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: stable/website/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
