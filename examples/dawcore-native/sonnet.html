<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dawcore — Sonnet 1</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f1a;
      color: #e0d4c8;
      padding: 24px;
    }
    h1 { font-size: 1.2rem; margin-bottom: 16px; }
    daw-editor {
      --daw-wave-color: #c49a6c;
      --daw-playhead-color: #d08070;
      --daw-background: #1a1a2e;
      --daw-track-background: #16213e;
      --daw-ruler-color: #c49a6c;
      --daw-ruler-background: #0f0f1a;
      margin-bottom: 12px;
    }
    daw-transport { display: flex; gap: 8px; margin-bottom: 12px; }
    daw-annotation-list { border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 4px; }
    .hint { font-size: 0.75rem; color: #888; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>dawcore — Sonnet 1 (annotations parity demo)</h1>

  <script type="module">import '@dawcore/components';</script>

  <daw-editor id="editor" samples-per-pixel="1024" wave-height="100" timescale>
    <daw-annotation-track id="sonnet" editable link-endpoints keyboard-controls box-label="id">
    </daw-annotation-track>
    <daw-track src="/media/audio/sonnet.mp3" name="Sonnet 1"></daw-track>
  </daw-editor>

  <daw-transport for="editor">
    <daw-play-button></daw-play-button>
    <daw-pause-button></daw-pause-button>
    <daw-stop-button></daw-stop-button>
    <daw-time-display></daw-time-display>
  </daw-transport>

  <daw-annotation-list for="sonnet"></daw-annotation-list>

  <p class="hint">
    Recreates the classic React annotations example: aeneas ids in the bars,
    full lines in the list. Arrows navigate, Enter plays a line, [ ] / { }
    nudge boundaries, Escape deselects. Text is editable in the list.
  </p>

  <script type="module">
    import { NativePlayoutAdapter } from '@dawcore/transport';
    const editor = document.getElementById('editor');
    const audioCtx = new AudioContext({ sampleRate: 48000, latencyHint: 0 });
    editor.adapter = new NativePlayoutAdapter(audioCtx);

    // Aeneas alignment data — copied verbatim from the React example
    // (website/src/components/examples/AnnotationsExample.tsx, defaultNotes).
    const notes = [
      {
        "begin": "0.000",
        "children": [],
        "end": "2.680",
        "id": "f000001",
        "language": "eng",
        "lines": ["1"]
      },
      {
        "begin": "2.680",
        "children": [],
        "end": "5.880",
        "id": "f000002",
        "language": "eng",
        "lines": ["From fairest creatures we desire increase,"]
      },
      {
        "begin": "5.880",
        "children": [],
        "end": "9.240",
        "id": "f000003",
        "language": "eng",
        "lines": ["That thereby beauty's rose might never die,"]
      },
      {
        "begin": "9.240",
        "children": [],
        "end": "11.920",
        "id": "f000004",
        "language": "eng",
        "lines": ["But as the riper should by time decease,"]
      },
      {
        "begin": "11.920",
        "children": [],
        "end": "15.280",
        "id": "f000005",
        "language": "eng",
        "lines": ["His tender heir might bear his memory:"]
      },
      {
        "begin": "15.280",
        "children": [],
        "end": "18.600",
        "id": "f000006",
        "language": "eng",
        "lines": ["But thou contracted to thine own bright eyes,"]
      },
      {
        "begin": "18.600",
        "children": [],
        "end": "22.800",
        "id": "f000007",
        "language": "eng",
        "lines": ["Feed'st thy light's flame with self-substantial fuel,"]
      },
      {
        "begin": "22.800",
        "children": [],
        "end": "25.680",
        "id": "f000008",
        "language": "eng",
        "lines": ["Making a famine where abundance lies,"]
      },
      {
        "begin": "25.680",
        "children": [],
        "end": "31.240",
        "id": "f000009",
        "language": "eng",
        "lines": ["Thy self thy foe, to thy sweet self too cruel:"]
      },
      {
        "begin": "31.240",
        "children": [],
        "end": "34.280",
        "id": "f000010",
        "language": "eng",
        "lines": ["Thou that art now the world's fresh ornament,"]
      },
      {
        "begin": "34.280",
        "children": [],
        "end": "36.960",
        "id": "f000011",
        "language": "eng",
        "lines": ["And only herald to the gaudy spring,"]
      },
      {
        "begin": "36.960",
        "children": [],
        "end": "40.680",
        "id": "f000012",
        "language": "eng",
        "lines": ["Within thine own bud buriest thy content,"]
      },
      {
        "begin": "40.680",
        "children": [],
        "end": "44.560",
        "id": "f000013",
        "language": "eng",
        "lines": ["And tender churl mak'st waste in niggarding:"]
      },
      {
        "begin": "44.560",
        "children": [],
        "end": "48.080",
        "id": "f000014",
        "language": "eng",
        "lines": ["Pity the world, or else this glutton be,"]
      },
      {
        "begin": "48.080",
        "children": [],
        "end": "53.240",
        "id": "f000015",
        "language": "eng",
        "lines": ["To eat the world's due, by the grave and thee."]
      }
    ];
    const track = document.getElementById('sonnet');
    for (const note of notes) {
      const a = document.createElement('daw-annotation');
      a.id = note.id;
      a.setAttribute('start', note.begin);
      a.setAttribute('end', note.end);
      a.textContent = note.lines.join('\n');
      track.appendChild(a);
    }
  </script>
</body>
</html>
